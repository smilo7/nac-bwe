[project]
name = "nac-bwe"
version = "0.1.0"
description = "Real-time bandwidth extension for small generative audio models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Milo Beuzeval" }]
keywords = ["audio", "bandwidth-extension", "neural-codec", "encodec", "vocos"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "auraloss>=0.4.0",
    "encodec>=0.1.1",
    "matplotlib>=3.8",
    "numpy>=2.4.4",
    "pyaml>=26.2.1",
    "setuptools<82",
    "soundfile>=0.13.1",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchcodec==0.9.1",
    "tqdm>=4.67.3",
    "transformers>=5.5.4",
    "vocos>=0.1.0",              # base package only; [train] pulls a broken fairseq build
    "wandb>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/smilo7/nac-bwe"
Experiments = "https://github.com/smilo7/nac-bwe-experiments"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
